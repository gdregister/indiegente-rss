name: Atualizar feed Indiegente

on:
  schedule:
    - cron: "17 */3 * * *"   # de 3 em 3 horas
  workflow_dispatch:          # botão "Run workflow" para correr à mão

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add episodes.json docs/feed.xml
          git diff --cached --quiet || git commit -m "Atualizar feed" && git push
